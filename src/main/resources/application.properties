spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/notesdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
app.auth.username=${APP_USER:admin}
app.auth.password=${APP_PASS:1234}
server.port=${SERVER_PORT:${PORT:8080}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
